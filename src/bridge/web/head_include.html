<!--
  Carlito bridge transport. Reviewable source of truth for the Web export
  preset's "Head Include" (export_presets.cfg html/head_include) — paste this <script>
  verbatim into that field. It installs the postMessage plumbing as early as possible,
  before the WASM boots, so no early carlitoInput message is missed.

  Contract with sloppyCAN's carlito.js:
    IN  : parent posts {type:'carlitoInput',  version, hash, values:{…}}  -> stashed here
    OUT : game calls __carlito.publish(values, challenge)
          -> posts {type:'carlitoOutput', version, hash, values, challenge}
          (`hash` is the contract's content SHA-256: same version, different hash = drift)
          (`challenge` is envelope, not a contract signal: true while an attempt runs)

  Inbound is intentionally not origin-gated on the game side: it only drives the local
  car (no sensitive sink). The dangerous direction — telemetry reaching a live CAN bus —
  is origin-gated on the sloppyCAN side (carlito.js checks e.origin === GAME_ORIGIN).
-->
<script>
  window.__carlito = { in: {}, inT: -1e9, ver: 0, hash: '', outVer: 0, outHash: '', publish: null };
  window.addEventListener('message', function (e) {
    var d = e.data;
    if (!d || d.type !== 'carlitoInput') return;
    if (typeof d.values !== 'object' || d.values === null || Array.isArray(d.values)) return;
    window.__carlito.in = d.values;
    window.__carlito.inT = performance.now();
    if (typeof d.version === 'number') window.__carlito.ver = d.version;
    if (typeof d.hash === 'string') window.__carlito.hash = d.hash;
  });
  window.__carlito.publish = function (values, challenge) {
    parent.postMessage({ type: 'carlitoOutput', version: window.__carlito.outVer, hash: window.__carlito.outHash, values: values, challenge: !!challenge }, '*');
  };
</script>
