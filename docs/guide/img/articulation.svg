<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 300" width="420" height="300">
<title>A tractor unit and semi-trailer seen from above, bent at the kingpin</title>
<!-- A schematic, not to scale. The trailer turns about the kingpin on the tractor's fifth wheel;
     the articulation angle is between the two bodies' centre lines, stopped at 75 degrees
     (Articulation.JACKKNIFE_MAX_DEG). -->
<style>
.ar-t{font:600 14px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;fill:var(--fig-ink,#1c1c1f)}
.ar-s{font:13px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;fill:var(--fig-muted,#6b6b75)}
.ar-body{fill:var(--fig-fill,#f3f1ec);stroke:var(--fig-ink,#1c1c1f);stroke-width:2}
.ar-tyre{fill:var(--fig-ink,#1c1c1f)}
.ar-axis{stroke:var(--fig-muted,#6b6b75);stroke-width:1.2;stroke-dasharray:5 4;fill:none}
.ar-arc{stroke:var(--fig-orange,#c45a12);stroke-width:2.5;fill:none}
.ar-pin{fill:var(--fig-orange,#c45a12)}
.ar-or-t{font:600 13px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;fill:var(--fig-orange,#c45a12)}
.ar-blue-t{font:600 13px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;fill:var(--fig-blue,#1d5ca8)}
@media (prefers-color-scheme:dark){
.ar-t{fill:var(--fig-ink,#e9e7e2)}.ar-s{fill:var(--fig-muted,#a6a6b0)}
.ar-body{fill:var(--fig-fill,#22242a);stroke:var(--fig-ink,#e9e7e2)}.ar-tyre{fill:var(--fig-ink,#e9e7e2)}
.ar-axis{stroke:var(--fig-muted,#a6a6b0)}.ar-arc{stroke:var(--fig-orange,#f0a060)}.ar-pin{fill:var(--fig-orange,#f0a060)}
.ar-or-t{fill:var(--fig-orange,#f0a060)}.ar-blue-t{fill:var(--fig-blue,#8ab6ff)}}
</style>
<!-- tractor unit: pointing up-right (rotated 30 deg), kingpin at (150,160) -->
<g transform="rotate(30 150 160)">
<rect class="ar-body" x="128" y="70" width="44" height="100" rx="8"/>
<rect class="ar-tyre" x="120" y="80" width="8" height="18" rx="2"/>
<rect class="ar-tyre" x="172" y="80" width="8" height="18" rx="2"/>
<rect class="ar-tyre" x="120" y="146" width="8" height="18" rx="2"/>
<rect class="ar-tyre" x="172" y="146" width="8" height="18" rx="2"/>
<line class="ar-axis" x1="150" y1="20" x2="150" y2="160"/>
</g>
<!-- trailer: straight down from the kingpin -->
<rect class="ar-body" x="126" y="150" width="48" height="130" rx="4"/>
<rect class="ar-tyre" x="118" y="236" width="8" height="16" rx="2"/>
<rect class="ar-tyre" x="174" y="236" width="8" height="16" rx="2"/>
<rect class="ar-tyre" x="118" y="256" width="8" height="16" rx="2"/>
<rect class="ar-tyre" x="174" y="256" width="8" height="16" rx="2"/>
<line class="ar-axis" x1="150" y1="40" x2="150" y2="290"/>
<!-- the kingpin and the angle -->
<circle class="ar-pin" cx="150" cy="160" r="6"/>
<path class="ar-arc" d="M150,100 A60,60 0 0 1 180,108"/>
<text class="ar-or-t" x="140" y="90" text-anchor="end">articulation angle</text>
<text class="ar-or-t" x="200" y="168">kingpin on the fifth wheel</text>
<path class="ar-axis" style="stroke-dasharray:none" d="M158,163 L196,164"/>
<text class="ar-blue-t" x="250" y="44">tractor unit</text>
<text class="ar-blue-t" x="190" y="230">semi-trailer</text>
<text class="ar-s" x="190" y="248">on its own wheels</text>
<text class="ar-s" x="190" y="264">and brakes</text>
</svg>
