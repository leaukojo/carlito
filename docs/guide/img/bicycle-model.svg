<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 290" width="420" height="290">
<title>The bicycle model: one steering angle, one turn centre</title>
<!-- Wheelbase 120 px, bicycle angle 30 deg to the right: turn centre on the rear-axle line at
     L / tan(30 deg) = 208 px from the car's centre line (WheelDrive: radius = wheelbase / tan angle). -->
<style>
.bm-t{font:600 14px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;fill:var(--fig-ink,#1c1c1f)}
.bm-s{font:13px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;fill:var(--fig-muted,#6b6b75)}
.bm-body{fill:var(--fig-fill,#f3f1ec);stroke:var(--fig-muted,#6b6b75);stroke-width:1.5}
.bm-wheel{fill:var(--fig-ink,#1c1c1f)}
.bm-ghost{fill:none;stroke:var(--fig-muted,#6b6b75);stroke-width:1.5;stroke-dasharray:4 3}
.bm-dash{stroke:var(--fig-blue,#1d5ca8);stroke-width:1.8;stroke-dasharray:6 4;fill:none}
.bm-path{stroke:var(--fig-orange,#c45a12);stroke-width:3;fill:none}
.bm-dim{stroke:var(--fig-ink,#1c1c1f);stroke-width:1.2;fill:none}
.bm-centre{fill:var(--fig-blue,#1d5ca8)}
.bm-blue-t{font:600 13px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;fill:var(--fig-blue,#1d5ca8)}
.bm-orange-t{font:600 13px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;fill:var(--fig-orange,#c45a12)}
@media (prefers-color-scheme:dark){
.bm-t{fill:var(--fig-ink,#e9e7e2)}.bm-s{fill:var(--fig-muted,#a6a6b0)}.bm-body{fill:var(--fig-fill,#22242a);stroke:var(--fig-muted,#a6a6b0)}
.bm-wheel{fill:var(--fig-ink,#e9e7e2)}.bm-ghost{stroke:var(--fig-muted,#a6a6b0)}.bm-dash{stroke:var(--fig-blue,#8ab6ff)}
.bm-path{stroke:var(--fig-orange,#f0a060)}.bm-dim{stroke:var(--fig-ink,#e9e7e2)}.bm-centre{fill:var(--fig-blue,#8ab6ff)}
.bm-blue-t{fill:var(--fig-blue,#8ab6ff)}.bm-orange-t{fill:var(--fig-orange,#f0a060)}}
</style>
<!-- the car, seen from above, nose up -->
<rect class="bm-body" x="118" y="78" width="64" height="184" rx="18"/>
<!-- path of the rear axle: a circle round the turn centre -->
<path class="bm-path" d="M150,230 A208,208 0 0 1 211,83"/>
<text class="bm-orange-t" x="226" y="122">path of the rear axle</text>
<!-- lines at right angles to each wheel, meeting at the turn centre -->
<line class="bm-dash" x1="150" y1="110" x2="358" y2="230"/>
<line class="bm-dash" x1="150" y1="230" x2="358" y2="230"/>
<circle class="bm-centre" cx="358" cy="230" r="6"/>
<text class="bm-blue-t" x="358" y="256" text-anchor="middle">turn centre</text>
<text class="bm-s" x="254" y="248" text-anchor="middle">turn radius</text>
<!-- the single front wheel, angled, and where it would point straight -->
<rect class="bm-ghost" x="143" y="92" width="14" height="36" rx="4"/>
<rect class="bm-wheel" x="143" y="92" width="14" height="36" rx="4" transform="rotate(30 150 110)"/>
<rect class="bm-wheel" x="143" y="212" width="14" height="36" rx="4"/>
<path class="bm-dim" d="M150,74 A36,36 0 0 1 168,78.8"/>
<line class="bm-dim" x1="150" y1="110" x2="150" y2="70"/>
<text class="bm-t" x="176" y="66">steering angle</text>
<!-- the wheelbase -->
<line class="bm-dim" x1="96" y1="110" x2="96" y2="230"/>
<line class="bm-dim" x1="90" y1="110" x2="102" y2="110"/>
<line class="bm-dim" x1="90" y1="230" x2="102" y2="230"/>
<text class="bm-s" x="88" y="166" text-anchor="end">wheelbase</text>
<text class="bm-s" x="88" y="110" text-anchor="end">front axle</text>
<text class="bm-s" x="88" y="234" text-anchor="end">rear axle</text>
</svg>
