<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 290" width="420" height="290">
<title>The sedan engine's torque and power against engine speed</title>
<!-- sedan_spec.tres torque_curve (900,98) (2000,154) (3200,184) (4800,185) (6000,185) (6600,170) (6800,61) N·m,
     linear between points; idle_rpm 900, redline_rpm 6800 (VehicleSpec defaults). Power = torque x rpm x 2pi/60.
     Torque axis 0-200 N·m on the left, power 0-125 kW on the right. -->
<style>
.tq-t{font:600 14px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;fill:var(--fig-ink,#1c1c1f)}
.tq-s{font:13px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;fill:var(--fig-muted,#6b6b75)}
.tq-axis{stroke:var(--fig-ink,#1c1c1f);stroke-width:1.5;fill:none}
.tq-grid{stroke:var(--fig-grid,#e3e0d8);stroke-width:1;fill:none}
.tq-zone{fill:var(--fig-fill,#f3f1ec)}
.tq-blue{stroke:var(--fig-blue,#1d5ca8);stroke-width:3.5;fill:none;stroke-linejoin:round}
.tq-orange{stroke:var(--fig-orange,#c45a12);stroke-width:2.5;fill:none;stroke-dasharray:6 4;stroke-linejoin:round}
.tq-blue-t{font:600 13px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;fill:var(--fig-blue,#1d5ca8)}
.tq-orange-t{font:600 13px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;fill:var(--fig-orange,#c45a12)}
@media (prefers-color-scheme:dark){
.tq-t{fill:var(--fig-ink,#e9e7e2)}.tq-s{fill:var(--fig-muted,#a6a6b0)}.tq-axis{stroke:var(--fig-ink,#e9e7e2)}
.tq-grid{stroke:var(--fig-grid,#30323a)}.tq-zone{fill:var(--fig-fill,#22242a)}.tq-blue{stroke:var(--fig-blue,#8ab6ff)}
.tq-orange{stroke:var(--fig-orange,#f0a060)}.tq-blue-t{fill:var(--fig-blue,#8ab6ff)}.tq-orange-t{fill:var(--fig-orange,#f0a060)}}
</style>
