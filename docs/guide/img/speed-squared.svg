<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 245" width="600" height="245">
<title>Twice the speed, four times the gap to pull back</title>
<!-- Circle radius 400 px, centre 400 px below each "the car now" dot. Straight-on step 120 px (slow) and
     240 px (twice as fast); the gap is measured towards the centre: sqrt(400² + s²) - 400 =
     17.6 px and 66.5 px, a ratio of 3.8 (it tends to exactly 4 as the step shrinks: gap ≈ s² / 2r). -->
<style>
.sq-t{font:600 14px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;fill:var(--fig-ink,#1c1c1f)}
.sq-s{font:13px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;fill:var(--fig-muted,#6b6b75)}
.sq-path{stroke:var(--fig-orange,#c45a12);stroke-width:3;fill:none}
.sq-dash{stroke:var(--fig-muted,#6b6b75);stroke-width:1.8;stroke-dasharray:6 4;fill:none}
.sq-pull{stroke:var(--fig-blue,#1d5ca8);stroke-width:2.5;fill:none}
.sq-fb{fill:var(--fig-blue,#1d5ca8)}
.sq-now{fill:var(--fig-ink,#1c1c1f)}
.sq-ghost{fill:var(--fig-fill,#f3f1ec);stroke:var(--fig-muted,#6b6b75);stroke-width:1.5}
.sq-blue-t{font:600 13px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;fill:var(--fig-blue,#1d5ca8)}
.sq-orange-t{font:600 13px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;fill:var(--fig-orange,#c45a12)}
@media (prefers-color-scheme:dark){
.sq-t{fill:var(--fig-ink,#e9e7e2)}.sq-s{fill:var(--fig-muted,#a6a6b0)}.sq-path{stroke:var(--fig-orange,#f0a060)}
.sq-dash{stroke:var(--fig-muted,#a6a6b0)}.sq-pull{stroke:var(--fig-blue,#8ab6ff)}.sq-fb{fill:var(--fig-blue,#8ab6ff)}
.sq-now{fill:var(--fig-ink,#e9e7e2)}.sq-ghost{fill:var(--fig-fill,#22242a);stroke:var(--fig-muted,#a6a6b0)}
.sq-blue-t{fill:var(--fig-blue,#8ab6ff)}.sq-orange-t{fill:var(--fig-orange,#f0a060)}}
</style>
<defs><marker id="sq-ab" markerWidth="9" markerHeight="9" refX="1" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path class="sq-fb" d="M0,0 L9,4.5 L0,9 Z"/></marker></defs>

<!-- slow -->
<text class="sq-t" x="30" y="36">Slow</text>
<path class="sq-path" d="M30,90 A400,400 0 0 1 200,127.9"/>
<text class="sq-orange-t" x="150" y="150">the circle</text>
<line class="sq-dash" x1="30" y1="90" x2="150" y2="90"/>
<text class="sq-s" x="30" y="72">no grip: 1 step straight on</text>
<line class="sq-pull" x1="148.8" y1="93.8" x2="148.5" y2="94.9" marker-end="url(#sq-ab)"/>
<circle class="sq-now" cx="30" cy="90" r="4.5"/>
<circle class="sq-ghost" cx="150" cy="90" r="4"/>
<circle class="sq-now" cx="144.9" cy="106.9" r="4.5"/>
<text class="sq-blue-t" x="162" y="104">gap 1</text>
<text class="sq-s" x="30" y="114">the car now</text>

<!-- twice as fast -->
<text class="sq-t" x="300" y="36">Twice as fast</text>
<path class="sq-path" d="M300,90 A400,400 0 0 1 570,194.9"/>
<line class="sq-dash" x1="300" y1="90" x2="540" y2="90"/>
<text class="sq-s" x="300" y="72">no grip: 2 steps straight on</text>
<line class="sq-pull" x1="537.9" y1="93.4" x2="512.2" y2="136.3" marker-end="url(#sq-ab)"/>
<circle class="sq-now" cx="300" cy="90" r="4.5"/>
<circle class="sq-ghost" cx="540" cy="90" r="4"/>
<circle class="sq-now" cx="505.8" cy="147" r="4.5"/>
<text class="sq-blue-t" x="532" y="132">gap 4</text>
<text class="sq-blue-t" x="496" y="176" text-anchor="end">the tyres pull it back</text>
<text class="sq-s" x="300" y="114">the car now</text>

<text class="sq-s" x="300" y="228" text-anchor="middle">Twice the steps, four times the gap to close in the same moment.</text>
</svg>
