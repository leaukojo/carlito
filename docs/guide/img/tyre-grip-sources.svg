<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 270" width="420" height="270">
<title>Where a tyre's grip comes from: the rubber wraps round the road's bumps, which push back on it, and much closer up, the molecules of rubber and road pull on each other</title>
<!-- Drawn by hand, no simulator numbers; not to scale. -->
<style>
.gs-t{font:600 14px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;fill:var(--fig-ink,#1c1c1f)}
.gs-s{font:13px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;fill:var(--fig-muted,#6b6b75)}
.gs-l{font:13px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;fill:var(--fig-ink,#1c1c1f)}
.gs-tb{font:600 13px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;fill:var(--fig-blue,#1d5ca8)}
.gs-to{font:600 13px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;fill:var(--fig-orange,#c45a12)}
.gs-rubber{fill:var(--fig-grid,#e3e0d8);stroke:var(--fig-ink,#1c1c1f);stroke-width:1.5;stroke-linejoin:round}
.gs-road{fill:var(--fig-muted,#6b6b75);fill-opacity:.45;stroke:var(--fig-ink,#1c1c1f);stroke-width:1.5;stroke-linejoin:round}
.gs-dot{fill:var(--fig-ink,#1c1c1f)}
.gs-div{stroke:var(--fig-muted,#6b6b75);stroke-width:1;stroke-dasharray:4 4}
.gs-b{stroke:var(--fig-blue,#1d5ca8);stroke-width:3;fill:none}.gs-fb{fill:var(--fig-blue,#1d5ca8)}
.gs-o{stroke:var(--fig-orange,#c45a12);stroke-width:3;fill:none}.gs-fo{fill:var(--fig-orange,#c45a12)}
.gs-link{stroke:var(--fig-orange,#c45a12);stroke-width:2}
@media (prefers-color-scheme:dark){
.gs-t,.gs-l{fill:var(--fig-ink,#e9e7e2)}.gs-s{fill:var(--fig-muted,#a6a6b0)}
.gs-tb{fill:var(--fig-blue,#8ab6ff)}.gs-to{fill:var(--fig-orange,#f0a060)}
.gs-rubber{fill:var(--fig-grid,#30323a);stroke:var(--fig-ink,#e9e7e2)}
.gs-road{fill:var(--fig-muted,#a6a6b0);stroke:var(--fig-ink,#e9e7e2)}
.gs-dot{fill:var(--fig-ink,#e9e7e2)}.gs-div{stroke:var(--fig-muted,#a6a6b0)}
.gs-b{stroke:var(--fig-blue,#8ab6ff)}.gs-fb{fill:var(--fig-blue,#8ab6ff)}
.gs-o{stroke:var(--fig-orange,#f0a060)}.gs-fo{fill:var(--fig-orange,#f0a060)}
.gs-link{stroke:var(--fig-orange,#f0a060)}
}
</style>
<defs>
<marker id="gs-ab" markerWidth="9" markerHeight="9" refX="1" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path class="gs-fb" d="M0,0 L9,4.5 L0,9 Z"/></marker>
<marker id="gs-ao" markerWidth="9" markerHeight="9" refX="1" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path class="gs-fo" d="M0,0 L9,4.5 L0,9 Z"/></marker>
</defs>
<line class="gs-div" x1="210" y1="12" x2="210" y2="258"/>
<!-- left: the rubber flows round the road's bumps, and the bumps' slopes push back on it -->
<text class="gs-t" x="105" y="26" text-anchor="middle">Wrapping round bumps</text>
<text class="gs-s" x="105" y="43" text-anchor="middle">(close up)</text>
<text class="gs-tb" x="105" y="60" text-anchor="middle">rubber pushed this way</text>
<line class="gs-b" x1="65" y1="74" x2="145" y2="74" marker-end="url(#gs-ab)"/>
<path class="gs-rubber" d="M15,95 L195,95 L195,190 L165,150 L135,190 L105,150 L75,190 L45,150 L15,190 Z"/>
<path class="gs-road" d="M15,190 L45,150 L75,190 L105,150 L135,190 L165,150 L195,190 L195,228 L15,228 Z"/>
<text class="gs-l" x="22" y="117">rubber</text>
<text class="gs-l" x="105" y="218" text-anchor="middle">road</text>
<line class="gs-o" x1="90" y1="170" x2="68" y2="153" marker-end="url(#gs-ao)"/>
<line class="gs-o" x1="150" y1="170" x2="128" y2="153" marker-end="url(#gs-ao)"/>
<text class="gs-to" x="105" y="252" text-anchor="middle">the bumps push back</text>
<!-- right: much closer up, the molecules of rubber and road pull on each other -->
<text class="gs-t" x="315" y="26" text-anchor="middle">Sticking</text>
<text class="gs-s" x="315" y="43" text-anchor="middle">(far closer up)</text>
<text class="gs-tb" x="315" y="60" text-anchor="middle">rubber pushed this way</text>
<line class="gs-b" x1="275" y1="74" x2="355" y2="74" marker-end="url(#gs-ab)"/>
<rect class="gs-rubber" x="225" y="95" width="180" height="55"/>
<rect class="gs-road" x="225" y="180" width="180" height="48"/>
<text class="gs-l" x="232" y="117">rubber</text>
<text class="gs-l" x="315" y="218" text-anchor="middle">road</text>
<line class="gs-link" x1="240" y1="144" x2="226" y2="186"/><line class="gs-link" x1="265" y1="144" x2="251" y2="186"/>
<line class="gs-link" x1="290" y1="144" x2="276" y2="186"/><line class="gs-link" x1="315" y1="144" x2="301" y2="186"/>
<line class="gs-link" x1="340" y1="144" x2="326" y2="186"/><line class="gs-link" x1="365" y1="144" x2="351" y2="186"/>
<line class="gs-link" x1="390" y1="144" x2="376" y2="186"/>
<circle class="gs-dot" cx="240" cy="144" r="4"/><circle class="gs-dot" cx="265" cy="144" r="4"/><circle class="gs-dot" cx="290" cy="144" r="4"/><circle class="gs-dot" cx="315" cy="144" r="4"/><circle class="gs-dot" cx="340" cy="144" r="4"/><circle class="gs-dot" cx="365" cy="144" r="4"/><circle class="gs-dot" cx="390" cy="144" r="4"/>
<circle class="gs-dot" cx="226" cy="186" r="4"/><circle class="gs-dot" cx="251" cy="186" r="4"/><circle class="gs-dot" cx="276" cy="186" r="4"/><circle class="gs-dot" cx="301" cy="186" r="4"/><circle class="gs-dot" cx="326" cy="186" r="4"/><circle class="gs-dot" cx="351" cy="186" r="4"/><circle class="gs-dot" cx="376" cy="186" r="4"/>
<text class="gs-to" x="315" y="252" text-anchor="middle">tiny pulls between molecules</text>
</svg>
