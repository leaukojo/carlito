<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 300" width="420" height="300">
<title>Air drag and rolling resistance on the sedan against speed</title>
<!-- sedan_spec.tres drag_area 0.65 m², rolling_resistance 0.012, mass 1150 kg; VehicleMath.AIR_DENSITY 1.225.
     Drag = 0.5 rho CdA v² (VehicleMath.aero_drag); rolling = crr m g = 135 N on a flat road. Crossover near 66 km/h. -->
<style>
.rs-t{font:600 14px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;fill:var(--fig-ink,#1c1c1f)}
.rs-s{font:13px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;fill:var(--fig-muted,#6b6b75)}
.rs-axis{stroke:var(--fig-ink,#1c1c1f);stroke-width:1.5;fill:none}
.rs-grid{stroke:var(--fig-grid,#e3e0d8);stroke-width:1;fill:none}
.rs-blue{stroke:var(--fig-blue,#1d5ca8);stroke-width:3.5;fill:none}
.rs-orange{stroke:var(--fig-orange,#c45a12);stroke-width:3;fill:none;stroke-dasharray:7 4}
.rs-blue-t{font:600 13px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;fill:var(--fig-blue,#1d5ca8)}
.rs-orange-t{font:600 13px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;fill:var(--fig-orange,#c45a12)}
@media (prefers-color-scheme:dark){
.rs-t{fill:var(--fig-ink,#e9e7e2)}.rs-s{fill:var(--fig-muted,#a6a6b0)}.rs-axis{stroke:var(--fig-ink,#e9e7e2)}
.rs-grid{stroke:var(--fig-grid,#30323a)}.rs-blue{stroke:var(--fig-blue,#8ab6ff)}.rs-orange{stroke:var(--fig-orange,#f0a060)}
.rs-blue-t{fill:var(--fig-blue,#8ab6ff)}.rs-orange-t{fill:var(--fig-orange,#f0a060)}}
</style>
