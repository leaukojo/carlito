<line class="tr-lm" x1="20" y1="150" x2="223.6" y2="78"/>
<line class="tr-lm" x1="20" y1="150" x2="121.8" y2="251.8"/>
<polygon class="tr-body" points="121.1,270.9 232.8,159.2 214.5,140.8 102.7,252.5"/>
<polygon class="tr-body" points="235.6,160 235.6,64 211.6,64 211.6,160"/>
<rect class="tr-fi" x="102.6" y="239.1" width="20" height="7" rx="2" transform="rotate(135 112.6 242.6)"/><rect class="tr-fi" x="121" y="257.5" width="20" height="7" rx="2" transform="rotate(135 131 261)"/><rect class="tr-fi" x="201.6" y="146.5" width="20" height="7" rx="2" transform="rotate(90 211.6 150)"/><rect class="tr-fi" x="225.6" y="146.5" width="20" height="7" rx="2" transform="rotate(90 235.6 150)"/><rect class="tr-fi" x="202.3" y="78.5" width="20" height="7" rx="2" transform="rotate(70.5 212.3 82)"/><rect class="tr-fi" x="225" y="70.5" width="20" height="7" rx="2" transform="rotate(70.5 235 74)"/>
<circle class="tr-fo" cx="223.6" cy="78" r="4"/>
<circle class="tr-fb" cx="121.8" cy="251.8" r="4"/>
<circle class="tr-fi" cx="20" cy="150" r="4.5"/>
<text class="tr-s" x="10" y="114">turning centre</text>
<text class="tr-to" x="253.6" y="64">path of the cab's</text>
<text class="tr-to" x="253.6" y="80">front wheels</text>
<text class="tr-tb" x="161.8" y="279.8">path of the trailer's</text>
<text class="tr-tb" x="161.8" y="295.8">rear wheels</text>
</svg>
