<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 300" width="420" height="300">
<title>The foot brake and the handbrake ending on the same pads of one rear disc brake</title>
<!-- Drawn by hand. The game: WheelDrive.tick adds parking_torque(...) to the rear wheel's service
     torque and both take the wheel's one RayWheel.brake_fade(); TowedBody.tick_towed likewise. -->
<style>
.b2-t{font:600 14px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;fill:var(--fig-ink,#1c1c1f)}
.b2-s{font:13px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;fill:var(--fig-muted,#6b6b75)}
.b2-line{stroke:var(--fig-ink,#1c1c1f);stroke-width:1.5;fill:none}
.b2-body{stroke:var(--fig-ink,#1c1c1f);stroke-width:1.5;fill:var(--fig-fill,#f1eee7)}
.b2-disc{fill:var(--fig-muted,#6b6b75)}
.b2-pad{fill:var(--fig-orange,#c45a12)}
.b2-fluid{stroke:var(--fig-blue,#1d5ca8);stroke-width:4;fill:none;stroke-linejoin:round}
.b2-fluid-f{fill:var(--fig-blue,#1d5ca8)}
.b2-cable{stroke:var(--fig-green,#2e7d32);stroke-width:2.5;fill:none;stroke-dasharray:7 4;stroke-linejoin:round}
.b2-cable-s{stroke:var(--fig-green,#2e7d32);stroke-width:3;fill:none}
.b2-heat{stroke:var(--fig-red,#b3261e);stroke-width:2;fill:none}
.b2-heat-t{font:600 13px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;fill:var(--fig-red,#b3261e)}
@media (prefers-color-scheme:dark){
.b2-t{fill:var(--fig-ink,#e9e7e2)}.b2-s{fill:var(--fig-muted,#a6a6b0)}
.b2-line{stroke:var(--fig-ink,#e9e7e2)}
.b2-body{stroke:var(--fig-ink,#e9e7e2);fill:var(--fig-fill,#26282e)}
.b2-disc{fill:var(--fig-muted,#a6a6b0)}
.b2-pad{fill:var(--fig-orange,#f0a060)}
.b2-fluid{stroke:var(--fig-blue,#8ab6ff)}.b2-fluid-f{fill:var(--fig-blue,#8ab6ff)}
.b2-cable{stroke:var(--fig-green,#7cc884)}.b2-cable-s{stroke:var(--fig-green,#7cc884)}
.b2-heat{stroke:var(--fig-red,#f08a80)}.b2-heat-t{fill:var(--fig-red,#f08a80)}}
</style>
<!-- The pedal and its fluid pipe to the caliper's piston -->
<rect class="b2-body" x="10" y="30" width="96" height="40" rx="6"/>
<text class="b2-t" x="58" y="55" text-anchor="middle">Pedal</text>
<path class="b2-fluid" d="M106,50 L196,50 L196,125 L252,125"/>
<text class="b2-s" x="150" y="42" text-anchor="middle">brake fluid</text>
<!-- The lever and its cable to the same piston, through a small lever on the caliper -->
<rect class="b2-body" x="10" y="200" width="110" height="40" rx="6"/>
<text class="b2-t" x="65" y="225" text-anchor="middle">Handbrake</text>
<path class="b2-cable" d="M120,220 L196,220 L196,188 L218,188"/>
<text class="b2-s" x="158" y="258" text-anchor="middle">steel cable</text>
<line class="b2-cable-s" x1="218" y1="188" x2="240" y2="160"/>
<!-- The disc, seen edge on, on the wheel hub; its rim runs under the caliper's bridge -->
<rect class="b2-disc" x="274" y="94" width="12" height="186"/>
<rect class="b2-body" x="286" y="204" width="100" height="30"/>
<text class="b2-s" x="336" y="254" text-anchor="middle">wheel hub</text>
<text class="b2-s" x="268" y="292" text-anchor="end">disc, turning with the wheel</text>
<!-- Caliper: a U around the disc's rim, the piston on the inner side -->
<path class="b2-body" d="M230,72 L330,72 L330,160 L298,160 L298,92 L252,92 L252,160 L230,160 Z"/>
<rect class="b2-fluid-f" x="253" y="100" width="9" height="50"/>
<!-- The pads, either side of the disc -->
<rect class="b2-pad" x="263" y="100" width="10" height="50"/>
<rect class="b2-pad" x="287" y="100" width="10" height="50"/>
<!-- Labels -->
<line class="b2-line" x1="292" y1="132" x2="352" y2="132"/>
<line class="b2-line" x1="268" y1="142" x2="352" y2="142"/>
<text class="b2-t" x="356" y="132">the same</text>
<text class="b2-t" x="356" y="148">pads</text>
<path class="b2-heat" d="M258,64 q6,-8 0,-16 M274,64 q6,-8 0,-16 M290,64 q6,-8 0,-16"/>
<text class="b2-heat-t" x="300" y="30">one temperature,</text>
<text class="b2-heat-t" x="300" y="46">one fade for both</text>
</svg>
