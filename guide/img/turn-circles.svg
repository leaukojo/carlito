<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 300" width="420" height="300">
<title>A car seen from above in a tight turn: each wheel runs round its own circle about one turning centre</title>
<!-- Drawn by hand to scale. Radii from the page's example: inner rear wheel 5 m, outer rear wheel 6.5 m (so a track of 1.5 m). The wheelbase of 2.5 m and so the front radii (5.6 m and 7.0 m, from Pythagoras) are assumed for the drawing; the front wheels are turned so each is square to its radius, as in Ackermann steering. -->
<style>
.tc-t{font:600 14px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;fill:var(--fig-ink,#1c1c1f)}
.tc-s{font:13px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;fill:var(--fig-muted,#6b6b75)}
.tc-tb{font:600 13px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;fill:var(--fig-blue,#1d5ca8)}
.tc-to{font:600 13px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;fill:var(--fig-orange,#c45a12)}
.tc-lm{stroke:var(--fig-muted,#6b6b75);stroke-width:1.2;fill:none;stroke-dasharray:5 4}
.tc-body{stroke:var(--fig-ink,#1c1c1f);stroke-width:1.5;fill:var(--fig-fill,#f1eee7)}
.tc-fi{fill:var(--fig-ink,#1c1c1f)}
.tc-b{stroke:var(--fig-blue,#1d5ca8);stroke-width:3;fill:none;stroke-linejoin:round}.tc-fb{fill:var(--fig-blue,#1d5ca8)}
.tc-o{stroke:var(--fig-orange,#c45a12);stroke-width:3;fill:none;stroke-linejoin:round}.tc-fo{fill:var(--fig-orange,#c45a12)}
@media (prefers-color-scheme:dark){
.tc-t{fill:var(--fig-ink,#e9e7e2)}.tc-s{fill:var(--fig-muted,#a6a6b0)}
.tc-tb{fill:var(--fig-blue,#8ab6ff)}.tc-to{fill:var(--fig-orange,#f0a060)}
.tc-lm{stroke:var(--fig-muted,#a6a6b0);}
.tc-body{stroke:var(--fig-ink,#e9e7e2);fill:var(--fig-fill,#26282e)}
.tc-fi{fill:var(--fig-ink,#e9e7e2)}
.tc-b{stroke:var(--fig-blue,#8ab6ff);}.tc-fb{fill:var(--fig-blue,#8ab6ff)}
.tc-o{stroke:var(--fig-orange,#f0a060);}.tc-fo{fill:var(--fig-orange,#f0a060)}
}
</style>
