<text class="tc-s" x="410" y="78" text-anchor="end">the smaller circles, outer</text>
<text class="tc-s" x="410" y="94" text-anchor="end">wheels the larger ones</text>
<text class="tc-s" x="252" y="266">rear axle line</text>
</svg>
