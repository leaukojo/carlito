<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 250" width="420" height="250">
<title>Where the energy of a litre of petrol goes in a car</title>
<!-- Real cars, not the simulator. Source: fueleconomy.gov, "Where the Energy Goes: Gasoline Vehicles"
     (https://www.fueleconomy.gov/feg/atv.shtml), combined city and highway driving: engine losses
     68-72 %, energy to the wheels 18-25 %, drivetrain losses 3-5 %, parasitic (accessory) losses
     4-6 %. Drawn as 70 / 10 / 20 %, bar widths to scale. The page does not split the engine's
     heat between exhaust and coolant, so neither does the drawing. -->
<style>
.fu-t{font:600 14px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;fill:var(--fig-ink,#1c1c1f)}
.fu-s{font:13px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;fill:var(--fig-muted,#6b6b75)}
.fu-tb{font:600 13px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;fill:var(--fig-blue,#1d5ca8)}
.fu-tr{font:600 13px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;fill:var(--fig-red,#b3261e)}
.fu-tm{font:600 13px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;fill:var(--fig-muted,#6b6b75)}
.fu-b{stroke:var(--fig-blue,#1d5ca8);stroke-width:2;fill:none}.fu-fb{fill:var(--fig-blue,#1d5ca8)}
.fu-r{stroke:var(--fig-red,#b3261e);stroke-width:2;fill:none}.fu-fr{fill:var(--fig-red,#b3261e)}
.fu-m{stroke:var(--fig-muted,#6b6b75);stroke-width:2;fill:none}.fu-fm{fill:var(--fig-muted,#6b6b75)}
@media (prefers-color-scheme:dark){
.fu-t{fill:var(--fig-ink,#e9e7e2)}.fu-s{fill:var(--fig-muted,#a6a6b0)}
.fu-tb{fill:var(--fig-blue,#8ab6ff)}.fu-tr{fill:var(--fig-red,#f08a80)}.fu-tm{fill:var(--fig-muted,#a6a6b0)}
.fu-b{stroke:var(--fig-blue,#8ab6ff)}.fu-fb{fill:var(--fig-blue,#8ab6ff)}
.fu-r{stroke:var(--fig-red,#f08a80)}.fu-fr{fill:var(--fig-red,#f08a80)}
.fu-m{stroke:var(--fig-muted,#a6a6b0)}.fu-fm{fill:var(--fig-muted,#a6a6b0)}}
</style>
<text class="fu-t" x="10" y="24">One litre of petrol, in a car</text>
<!-- The bar: 400 units = all the fuel's energy -->
<rect class="fu-fr" x="10" y="40" width="280" height="56" fill-opacity="0.3"/>
<rect class="fu-fm" x="290" y="40" width="40" height="56" fill-opacity="0.3"/>
<rect class="fu-fb" x="330" y="40" width="80" height="56" fill-opacity="0.3"/>
<text class="fu-t" x="150" y="74" text-anchor="middle">70 %</text>
<text class="fu-t" x="370" y="74" text-anchor="middle">20 %</text>
<!-- Heat in the engine -->
<line class="fu-r" x1="150" y1="102" x2="150" y2="132"/>
<text class="fu-tr" x="150" y="152" text-anchor="middle">heat in the engine</text>
<text class="fu-s" x="150" y="170" text-anchor="middle">out through the exhaust</text>
<text class="fu-s" x="150" y="186" text-anchor="middle">and the radiator</text>
<!-- Gears, pumps and fans -->
<line class="fu-m" x1="310" y1="102" x2="310" y2="194"/>
<text class="fu-tm" x="310" y="214" text-anchor="middle">10 %</text>
<text class="fu-s" x="310" y="232" text-anchor="middle">to the gears, pumps and fans</text>
<!-- To the wheels -->
<line class="fu-b" x1="370" y1="102" x2="370" y2="132"/>
<text class="fu-tb" x="370" y="152" text-anchor="middle">to the wheels</text>
<text class="fu-s" x="370" y="170" text-anchor="middle">moves the car</text>
</svg>
